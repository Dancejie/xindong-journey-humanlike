services:
  - type: web
    name: xindong-journey-humanlike
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && test -f frontend/dist/index.html
    startCommand: python -m backend.init_db && uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_AUTH_MODE
        value: public
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: AGENT_RATE_LIMIT
        value: "20"
      - key: AGENT_GLOBAL_RATE_LIMIT
        value: "200"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: xindong-journey-humanlike-db
          property: connectionString

databases:
  - name: xindong-journey-humanlike-db
    plan: free
    region: singapore
    databaseName: xindong_journey_humanlike
    user: xindong_journey_humanlike
    ipAllowList: []
