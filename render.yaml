services:
  - type: web
    name: xindong-journey-humanlike
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && test -f frontend/dist/index.html
    startCommand: python -m backend.init_db && uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_AUTH_MODE
        value: public
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_BASE
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DOTS_API_BASE
        value: https://note3-prev-api.askdiandian.com/v1
      - key: DOTS_MODEL
        value: dots3-note-prev
      - key: DOTS_ENABLE_THINKING
        value: "false"
      - key: DOTS_API_KEY
        sync: false
      - key: AGENT_RATE_LIMIT
        value: "20"
      - key: AGENT_GLOBAL_RATE_LIMIT
        value: "200"
      - key: DB_SCHEMA
        value: xindong_journey_humanlike
      - key: DATABASE_URL
        # Use the verified external PostgreSQL connection stored in Render.
        # Do not bind this secret back to the expiring Render free database.
        sync: false
